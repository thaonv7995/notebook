name: NotebookStudio
options:
  bundleIdPrefix: com.thaonv.notebookstudio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: "Notebook Studio"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    majorVersion: 4.5.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    majorVersion: 4.2.2

targets:
  NotebookStudio:
    type: application
    platform: iOS
    sources:
      - path: NotebookStudio
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.thaonv.notebookstudio
        INFOPLIST_KEY_CFBundleDisplayName: "Notebook Studio"
    dependencies:
      - package: Lottie
      - package: KeychainAccess
    info:
      path: NotebookStudio/Info.plist
      properties:
        UIAppFonts:
          - "PlusJakartaSans[wght].ttf"
          - "PlusJakartaSans-Italic[wght].ttf"

  NotebookStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotebookStudioTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: NotebookStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

