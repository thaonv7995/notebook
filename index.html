<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebook Studio • Sổ Tay Thông Minh & Mẫu A4</title>
  <meta name="description" content="Sổ tay ghi chép số cá nhân cao cấp, quản lý các cuốn sổ A4 Cornell, Work Notes, Ruled, lật trang 3D chân thực, hỗ trợ chế độ 1 trang và 2 trang song song.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='7' fill='%232563eb'/%3E%3Cpath d='M20 6v52M26 18h20M26 28h20M26 38h16' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ========================================================
       VIEW 1: DIGITAL LIBRARY (TỦ SÁCH / DANH SÁCH CUỐN SỔ)
       Matching reference screenshot 1
       ======================================================== -->
  <div id="libraryView" class="library-view">
    <header class="lib-header">
      <div class="lib-brand" id="libBrandLogo">
        <div class="lib-brand-icon">📓</div>
        <div class="lib-brand-name">Notebook <span>Studio</span></div>
      </div>

      <div class="lib-search-container">
        <div class="lib-search-box">
          <svg class="lib-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="libSearchInput" class="lib-search-input" placeholder="Tìm trong các cuốn sổ..." />
        </div>

        <select id="libCategoryFilter" class="lib-category-select">
          <option value="all">Tất cả sổ ▾</option>
        </select>

        <select id="libSortSelect" class="lib-category-select" title="Sắp xếp tủ sổ">
          <option value="recent">Cập nhật gần đây</option>
          <option value="created">Mới tạo</option>
          <option value="title">Tên A–Z</option>
        </select>
      </div>

      <div class="lib-header-right">
        <button id="btnOpenNewBookModal" class="btn-new-book" aria-label="Tạo sổ mới">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span>Tạo sổ mới</span>
        </button>

        <div class="lib-user-badge" title="Dữ liệu hiện được lưu trên trình duyệt này">
          <div class="lib-avatar">●</div>
          <span class="lib-username">Lưu trên thiết bị</span>
        </div>
      </div>
    </header>

    <main class="lib-main">
      <div class="lib-section-title-row">
        <div class="lib-title-group">
          <h1 class="lib-section-title">Tủ Sổ Tay Của Bạn</h1>
          <span id="libBookCount" class="lib-section-count">4 cuốn sổ</span>
        </div>
        <div class="lib-section-actions">
          <button id="btnToggleTrash" class="btn-lib-ghost" title="Xem các sổ đã xóa">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            <span id="trashButtonText">Thùng rác</span>
          </button>
          <button id="btnResetLibrary" class="btn-lib-ghost" title="Khôi phục 4 cuốn sổ mẫu A4 ban đầu">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            <span>Khôi phục mẫu A4</span>
          </button>
        </div>
      </div>

      <!-- The Grid of Book Covers -->
      <div id="booksGrid" class="lib-books-grid">
        <!-- Dynamically rendered by app.js -->
      </div>
    </main>
  </div>

  <!-- ========================================================
       VIEW 2: OPEN NOTEBOOK (NHƯ 1 CUỐN SỔ BÌNH THƯỜNG)
       Matching reference screenshot 2: 1-Page / 2-Page mode + Flip Animation
       ======================================================== -->
  <div id="notebookView" class="notebook-view hidden">
    <!-- Inside Notebook Header (Matching Screenshot 2) -->
    <header class="reader-header">
      <div class="reader-header-left">
        <button id="btnBackToLibrary" class="btn-back-reader" title="Quay lại thư viện">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="reader-title-box">
          <span id="openBookTitle" class="reader-book-title" title="Bấm vào để đổi tên cuốn sổ">Sổ Ghi Chép</span>
          <button id="btnRenameBook" class="btn-rename-book" title="Đổi tên cuốn sổ">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <button id="btnCopyBookLink" class="btn-rename-book" title="Sao chép deep-link chỉ dùng trên thiết bị này">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
      </div>

      <!-- Center: Pagination & Zoom & Mode Toggle -->
      <div class="reader-header-center">
        <!-- Pagination controls -->
        <div class="reader-pagination-box">
          <button id="btnPrevPage" class="btn-reader-page" title="Lật trang trước">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <input type="text" id="readerPageInput" class="reader-page-input" value="1" title="Nhập số trang để nhảy nhanh" />
          <span class="reader-total-pages" id="readerTotalPages">/ 10</span>
          <button id="btnNextPage" class="btn-reader-page" title="Lật trang sau">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Scale / Zoom Controls -->
        <div class="reader-scale-box">
          <button id="btnZoomOut" class="btn-reader-scale" title="Thu nhỏ (−)">−</button>
          <span id="readerScaleValue" class="reader-scale-value" title="Nhấp để đặt lại 100%">100%</span>
          <button id="btnZoomIn" class="btn-reader-scale" title="Phóng to (+)">+</button>
          <button id="btnFitPage" class="btn-reader-fit active" title="Vừa toàn bộ trang (Fit Page)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="3" x2="12" y2="21"></line>
              <polyline points="8 7 12 3 16 7"></polyline>
              <polyline points="8 17 12 21 16 17"></polyline>
              <line x1="4" y1="3" x2="20" y2="3"></line>
              <line x1="4" y1="21" x2="20" y2="21"></line>
            </svg>
          </button>
          <button id="btnFitWidth" class="btn-reader-fit" title="Vừa chiều rộng (Fit Width)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <polyline points="7 8 3 12 7 16"></polyline>
              <polyline points="17 8 21 12 17 16"></polyline>
              <line x1="3" y1="4" x2="3" y2="20"></line>
              <line x1="21" y1="4" x2="21" y2="20"></line>
            </svg>
          </button>
        </div>

        <!-- View Mode Switcher: 1 Page vs 2 Pages (Icon Only) -->
        <div class="reader-mode-toggle">
          <button id="btnMode1Page" class="btn-mode-pill" title="1 Trang">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="3" width="14" height="18" rx="2"/>
              <line x1="9" y1="8" x2="15" y2="8"/>
              <line x1="9" y1="12" x2="15" y2="12"/>
              <line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
          </button>
          <button id="btnMode2Pages" class="btn-mode-pill active" title="2 Trang (Mở sổ)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </button>
        </div>

        <!-- Template Chooser -->
        <select id="readerTemplateSelect" class="reader-template-select" title="Định dạng bố cục sổ tay">
          <option value="cornell">✨ Cornell</option>
          <option value="work">💼 Work Notes</option>
          <option value="ruled">📏 Kẻ ngang</option>
        </select>
      </div>

      <!-- Right Header: Add Page & Save Status (Icon Only) -->
      <div class="reader-header-right">
        <button id="btnToggleFormatToolbar" class="btn-header-icon" type="button" title="Ẩn/hiện thanh định dạng" aria-label="Ẩn thanh định dạng" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="17" r="2"/></svg>
        </button>

        <button id="btnToggleFullscreen" class="btn-header-icon" type="button" title="Toàn màn hình" aria-label="Mở chế độ toàn màn hình">
          <svg class="icon-enter-fullscreen" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          <svg class="icon-exit-fullscreen" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
        </button>

        <button id="btnAddPage" class="btn-add-page-reader" title="Thêm trang mới">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
        </button>

        <div id="save-status" data-state="saved" role="status" aria-live="polite" title="Đã lưu tự động">
          <svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true">
            <g class="status-mark status-mark--saved">
              <circle cx="12" cy="12" r="8" />
              <path d="m8.5 12 2.2 2.2 4.8-5" />
            </g>
            <g class="status-mark status-mark--dirty">
              <circle cx="12" cy="12" r="8" />
              <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" />
            </g>
            <g class="status-mark status-mark--loading">
              <circle cx="12" cy="12" r="8" stroke-dasharray="35 16" />
            </g>
            <g class="status-mark status-mark--error">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 8v5M12 16h.01" />
            </g>
          </svg>
          <span id="save-status-text" class="sr-only">Đã lưu tự động</span>
        </div>
      </div>
    </header>

    <!-- Sub-Toolbar (From Process-Note: Formatting) -->
    <nav class="editor-toolbar" aria-label="Editor Formatting Toolbar">
      <div class="toolbar-group">
        <button id="fmt-bold" type="button" class="tool-btn" title="In đậm (Ctrl/Cmd+B)">
          <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
        </button>
        <button id="fmt-italic" type="button" class="tool-btn" title="In nghiêng (Ctrl/Cmd+I)">
          <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
        </button>
        <button id="fmt-underline" type="button" class="tool-btn" title="Gạch chân (Ctrl/Cmd+U)">
          <svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </button>
        <button id="fmt-strike" type="button" class="tool-btn" title="Gạch ngang">
          <svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>

        <!-- Color Palette -->
        <div class="export-wrapper">
          <button id="fmt-color-btn" type="button" class="tool-btn tool-btn--indicator" title="Màu chữ" aria-haspopup="true">
            <span class="tool-indicator-letter">A</span>
            <span id="current-color-bar" class="tool-indicator-bar"></span>
          </button>
          <div id="fmt-color-palette" class="export-menu" hidden>
            <div class="palette-title">Màu chữ</div>
            <div class="palette-grid">
              <button type="button" class="color-swatch color-swatch--reset" data-color="" title="Mặc định">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/></svg>
              </button>
              <button type="button" class="color-swatch" data-color="#e11d48" style="--swatch:#e11d48" title="Đỏ"></button>
              <button type="button" class="color-swatch" data-color="#2563eb" style="--swatch:#2563eb" title="Xanh dương"></button>
              <button type="button" class="color-swatch" data-color="#16a34a" style="--swatch:#16a34a" title="Xanh lá"></button>
              <button type="button" class="color-swatch" data-color="#d97706" style="--swatch:#d97706" title="Vàng cam"></button>
              <button type="button" class="color-swatch" data-color="#9333ea" style="--swatch:#9333ea" title="Tím"></button>
              <button type="button" class="color-swatch" data-color="#db2777" style="--swatch:#db2777" title="Hồng"></button>
              <button type="button" class="color-swatch" data-color="#0891b2" style="--swatch:#0891b2" title="Xanh lơ"></button>
            </div>
          </div>
        </div>

        <!-- Highlight Palette -->
        <div class="export-wrapper">
          <button id="fmt-bg-btn" type="button" class="tool-btn tool-btn--indicator" title="Màu nền dạ quang" aria-haspopup="true">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span id="current-bg-bar" class="tool-indicator-bar tool-indicator-bar--bg"></span>
          </button>
          <div id="fmt-bg-palette" class="export-menu" hidden>
            <div class="palette-title">Màu nền dạ quang</div>
            <div class="palette-grid">
              <button type="button" class="color-swatch color-swatch--reset" data-bg="" title="Không nền">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/></svg>
              </button>
              <button type="button" class="color-swatch" data-bg="#fef08a" style="--swatch:#fef08a" title="Vàng sáng"></button>
              <button type="button" class="color-swatch" data-bg="#fecdd3" style="--swatch:#fecdd3" title="Đỏ nhạt"></button>
              <button type="button" class="color-swatch" data-bg="#bbf7d0" style="--swatch:#bbf7d0" title="Xanh lá nhạt"></button>
              <button type="button" class="color-swatch" data-bg="#bfdbfe" style="--swatch:#bfdbfe" title="Xanh dương nhạt"></button>
              <button type="button" class="color-swatch" data-bg="#e9d5ff" style="--swatch:#e9d5ff" title="Tím nhạt"></button>
              <button type="button" class="color-swatch" data-bg="#fed7aa" style="--swatch:#fed7aa" title="Cam nhạt"></button>
              <button type="button" class="color-swatch" data-bg="rgba(148, 163, 184, 0.25)" style="--swatch:#cbd5e1" title="Xám nhạt"></button>
            </div>
          </div>
        </div>

        <!-- Pill Badge Button -->
        <button id="fmt-badge-btn" type="button" class="tool-btn" title="Viền hình viên thuốc (Pill Badge)">
          <div class="badge-pill-icon"></div>
        </button>

        <!-- Clear Format -->
        <button id="fmt-clear" type="button" class="tool-btn" title="Xóa định dạng">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11l-6 6m10-6l6 6"/></svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Headings -->
      <div class="toolbar-group">
        <button id="fmt-h1" type="button" class="tool-btn tool-btn--text" title="Tiêu đề 1 (H1)">H1</button>
        <button id="fmt-h2" type="button" class="tool-btn tool-btn--text" title="Tiêu đề 2 (H2)">H2</button>
        <button id="fmt-h3" type="button" class="tool-btn tool-btn--text" title="Tiêu đề 3 (H3)">H3</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Lists & Formats -->
      <div class="toolbar-group">
        <button id="fmt-bullet" type="button" class="tool-btn" title="Danh sách gạch đầu dòng (•)">
          <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="2" fill="currentColor"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="4" cy="18" r="2" fill="currentColor"/></svg>
        </button>
        <button id="fmt-number" type="button" class="tool-btn" title="Danh sách số (1, 2, 3)">
          <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v5M3 11h3M3 15h3l-3 4h3"/></svg>
        </button>
        <button id="fmt-todo" type="button" class="tool-btn" title="Danh sách việc cần làm (Checkbox)">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button id="fmt-quote" type="button" class="tool-btn" title="Trích dẫn (Quote)">
          <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2 1 0 1 0 1 1 0 2-2 4-2 7zm11 0c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2 1 0 1 0 1 1 0 2-2 4-2 7z"/></svg>
        </button>
        <button id="fmt-code" type="button" class="tool-btn" title="Khối mã / Code (`code`)">
          <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        <button id="fmt-hr" type="button" class="tool-btn" title="Đường phân cách (---)">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke-width="2.5"/></svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Undo / Redo -->
      <div class="toolbar-group">
        <button id="fmt-undo" type="button" class="tool-btn" title="Hoàn tác (Ctrl/Cmd+Z)">
          <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button id="fmt-redo" type="button" class="tool-btn" title="Làm lại (Ctrl/Cmd+Shift+Z / Y)">
          <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        </button>
      </div>



      <div class="toolbar-divider"></div>

      <!-- Font Family -->
      <div class="toolbar-group" title="Phông chữ">
        <select id="fmt-font-family" class="toolbar-font-select" title="Phông chữ ghi chép">
          <option value="sans">Jakarta (Sans)</option>
          <option value="vietnam">Việt Pro (Sans)</option>
          <option value="serif">Garamond (Serif)</option>
          <option value="kaiti">Hán ngữ (Khải thể 楷体)</option>
          <option value="mono">JetBrains (Mono)</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Font Size -->
      <div class="toolbar-group" title="Cỡ chữ">
        <button id="font-decrease" type="button" class="tool-btn" title="Giảm cỡ chữ (A−)">
          <span class="tool-text-label">A−</span>
        </button>
        <button id="font-reset" type="button" class="tool-badge-btn" title="Đặt lại cỡ chữ">
          <span id="font-size-label">16</span>
        </button>
        <button id="font-increase" type="button" class="tool-btn" title="Tăng cỡ chữ (A+)">
          <span class="tool-text-label">A+</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Line Spacing Setting (Ô kẻ ngang) -->
      <div class="toolbar-group" title="Cỡ ô kẻ ngang">
        <div class="export-wrapper">
          <button id="btnLineHeightSettings" type="button" class="tool-btn" title="Cài đặt cỡ ô kẻ ngang" aria-haspopup="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span id="line-height-label" style="font-size: 11px; font-weight: 700; margin-left: 2px;">28px</span>
          </button>
          <div id="line-height-menu" class="export-menu" hidden style="min-width: 175px;">
            <div class="palette-title">Cỡ ô kẻ ngang</div>
            <button type="button" class="menu-item line-height-option" data-lh="24">
              <span>Dòng hẹp (24px)</span>
            </button>
            <button type="button" class="menu-item line-height-option active" data-lh="28">
              <span>Tiêu chuẩn (28px)</span>
            </button>
            <button type="button" class="menu-item line-height-option" data-lh="32">
              <span>Dòng vừa (32px)</span>
            </button>
            <button type="button" class="menu-item line-height-option" data-lh="36">
              <span>Dòng rộng (36px - Chữ Hán)</span>
            </button>
            <button type="button" class="menu-item line-height-option" data-lh="42">
              <span>Dòng đại (42px)</span>
            </button>
            <button type="button" class="menu-item line-height-option" data-lh="none">
              <span>Giấy trơn (Không kẻ)</span>
            </button>
          </div>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Delete Page -->
      <div class="toolbar-group">
        <button id="btnDeleteCurrentPage" type="button" class="tool-btn btn-tool-danger" title="Xóa trang hiện tại khỏi cuốn sổ">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>

      <div style="flex: 1;"></div>

      <!-- PDF export -->
      <div class="toolbar-group">
        <div class="export-wrapper">
          <button id="export-print" type="button" class="tool-btn" title="In / Lưu PDF" aria-label="Chọn cách in hoặc lưu cuốn sổ thành PDF" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          </button>
          <div id="pdf-export-menu" class="export-menu pdf-export-menu" role="menu" hidden>
            <button id="export-pdf-with-cover" type="button" class="pdf-export-menu__item" role="menuitem">
              <span class="pdf-export-menu__icon">▣</span>
              <span><strong>PDF kèm bìa</strong><small>Bìa A4 + toàn bộ nội dung</small></span>
            </button>
            <button id="export-pdf-content-only" type="button" class="pdf-export-menu__item" role="menuitem">
              <span class="pdf-export-menu__icon">≡</span>
              <span><strong>Chỉ nội dung</strong><small>Toàn bộ trang ghi chép</small></span>
            </button>
          </div>
        </div>
      </div>

      <button id="btnToolbarMore" type="button" class="tool-btn toolbar-more-btn" title="Hiện thêm công cụ" aria-label="Hiện thêm công cụ định dạng" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
      </button>
    </nav>

    <aside id="fullscreenRail" class="fullscreen-rail" aria-label="Điều khiển toàn màn hình" hidden>
      <button id="btnFullscreenExit" type="button" title="Thoát toàn màn hình" aria-label="Thoát toàn màn hình">
        <svg viewBox="0 0 24 24"><path d="M9 3H4a1 1 0 0 0-1 1v5M15 3h5a1 1 0 0 1 1 1v5M9 21H4a1 1 0 0 1-1-1v-5M15 21h5a1 1 0 0 0 1-1v-5"/></svg>
      </button>
      <span class="fullscreen-rail-divider"></span>
      <button id="btnFullscreenChrome" type="button" title="Hiện thanh công cụ" aria-label="Hiện thanh công cụ" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      </button>
      <button id="btnFullscreenPrev" type="button" title="Trang trước" aria-label="Trang trước">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button id="btnFullscreenNext" type="button" title="Trang sau" aria-label="Trang sau">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button id="btnFullscreenAddPage" type="button" title="Thêm trang" aria-label="Thêm trang">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </aside>

    <!-- The 3D Open Book Spread (With 1-Page and 2-Page modes) -->
    <main class="open-book-workspace" id="openBookWorkspace">
      <div class="book-desk-scaler" id="bookDeskScaler">
        <div class="book-spread-casing" id="bookSpreadCasing">
          <!-- Silk Bookmark Ribbon in Center -->
          <div class="book-center-ribbon"></div>

          <!-- Left Page Sheet (Trang Trái) -->
          <article class="book-page-sheet book-page-left" id="leftPageSheet">
            <span class="page-lang-tag" id="leftPageLangTag">VI</span>
            <div class="page-content-wrapper" id="leftPageContentWrapper">
              <!-- Editor or Template is mounted here -->
              <div id="leftEditorContainer"></div>
            </div>
            <footer class="book-page-footer">
              <span id="leftPageFooterTitle" class="book-page-footer-title">GIỚI THIỆU</span>
              <span id="leftPageFooterNum">Trang 1</span>
            </footer>
          </article>

          <!-- Book Center Spine -->
          <div class="book-center-spine" id="bookCenterSpine"></div>

          <!-- Right Page Sheet (Trang Phải) -->
          <article class="book-page-sheet book-page-right" id="rightPageSheet">
            <span class="page-lang-tag" id="rightPageLangTag">EN</span>
            <div class="page-content-wrapper" id="rightPageContentWrapper">
              <!-- Editor or Template is mounted here -->
              <div id="rightEditorContainer"></div>
            </div>
            <footer class="book-page-footer">
              <span id="rightPageFooterTitle" class="book-page-footer-title">INTRODUCTION</span>
              <span id="rightPageFooterNum">Trang 2</span>
            </footer>
          </article>
        </div>
      </div>
    </main>
  </div>

  <!-- ========================================================
       MODAL: TẠO CUỐN SỔ MỚI
       ======================================================== -->
  <div id="newNotebookModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Tạo Cuốn Sổ Mới</h2>
        <button id="btnCloseModal" class="btn-close-modal" aria-label="Close Modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="newNotebookTitle" class="form-label">Tên cuốn sổ:</label>
          <input type="text" id="newNotebookTitle" class="form-input" placeholder="Ví dụ: System Design, Quản Lý Dự Án, Nhật Ký..." />
        </div>

        <div class="form-group">
          <label for="newNotebookCategory" class="form-label">Chủ đề / Phân loại:</label>
          <input type="text" id="newNotebookCategory" class="form-input" placeholder="Công nghệ, Quản lý, Kỹ năng, Đọc sách..." value="Công nghệ" />
        </div>

        <div class="form-group">
          <label for="newNotebookTemplate" class="form-label">Mẫu định dạng trang:</label>
          <select id="newNotebookTemplate" class="form-input">
            <option value="cornell">✨ Cornell Notes (A4 Study Journal - 30/70 Cues & Summary)</option>
            <option value="work">💼 Work & Project (A4 Planner - Agenda, Notes & Action Checklists)</option>
            <option value="ruled">📏 Ruled Notebook (A4 Sổ Kẻ Ngang 32 Dòng)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Phong cách bìa sách:</label>
          <div class="color-palette-choices">
            <div class="cover-color-option selected" style="background: linear-gradient(135deg, #dc2626, #991b1b);" data-gradient="linear-gradient(135deg, #dc2626, #991b1b)" title="Đỏ Rượu / Crimson Red"></div>
            <div class="cover-color-option" style="background: linear-gradient(135deg, #1e293b, #0f172a);" data-gradient="linear-gradient(135deg, #1e293b, #0f172a)" title="Xanh Đêm / Midnight Navy"></div>
            <div class="cover-color-option" style="background: linear-gradient(135deg, #15803d, #166534);" data-gradient="linear-gradient(135deg, #15803d, #166534)" title="Xanh Ngọc Lục Bảo / Forest Emerald"></div>
            <div class="cover-color-option" style="background: linear-gradient(135deg, #b45309, #78350f);" data-gradient="linear-gradient(135deg, #b45309, #78350f)" title="Nâu Da Bò / Vintage Tan"></div>
            <div class="cover-color-option" style="background: linear-gradient(135deg, #0284c7, #0369a1);" data-gradient="linear-gradient(135deg, #0284c7, #0369a1)" title="Xanh Lam / Royal Blue"></div>
            <div class="cover-color-option" style="background: linear-gradient(135deg, #f8fafc, #cbd5e1);" data-gradient="linear-gradient(135deg, #f8fafc, #cbd5e1)" title="Xám Bạc Tối Giản / Minimalist Slate"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnCancelModal" class="btn-modal btn-modal--cancel">Hủy bỏ</button>
        <button id="btnConfirmNewNotebook" class="btn-modal btn-modal--confirm">Tạo cuốn sổ</button>
      </div>
    </div>
  </div>

  <div id="appToast" class="app-toast" role="status" aria-live="polite" hidden>
    <span id="appToastText"></span>
    <button id="appToastAction" type="button" hidden></button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
